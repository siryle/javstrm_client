name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JavStrm unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check build environment
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Verify core and project
        run: bash scripts/verify.sh

      - name: Build and inspect unsigned IPA
        run: bash scripts/build_ipa.sh unsigned

      - name: Upload unsigned IPA and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: JavStrm-unsigned-ipa-${{ github.run_number }}
          path: |
            build/ipa-*/JavStrm-unsigned.ipa
            build/ipa-*/JavStrm-unsigned.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(build/ipa-*/JavStrm-unsigned.ipa build/ipa-*/JavStrm-unsigned.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="$GITHUB_REF_NAME"
            release_options=(--verify-tag)
          else
            release_tag="ci-${GITHUB_RUN_NUMBER}"
            release_options=(--target "$GITHUB_SHA" --prerelease --latest=false)
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            notes_file="$(mktemp)"
            printf 'Unsigned iOS IPA built from commit %s.\n\nWorkflow: %s/%s/actions/runs/%s\n\nSign the IPA before installing it on an iPhone or iPad.\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
              > "$notes_file"
            gh release create "$release_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "JavStrm ${release_tag}" \
              --notes-file "$notes_file" \
              "${release_options[@]}"
            rm -f "$notes_file"
          fi

          release_url="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          printf 'Release: [%s](%s)\n' "$release_tag" "$release_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: JavStrm-build-logs-${{ github.run_number }}
          path: build/ipa-*/*.log
          if-no-files-found: ignore
          retention-days: 14
